<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Smooth Human Tracker</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}:root{--green:#30d158;--blue:#0a84ff;--red:#ff453a;--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#8e8e93}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}header{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}header h1{font-size:1.35rem;font-weight:700}#liveBadge{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:20px;padding:5px 13px;font-size:.75rem;font-weight:600;color:var(--muted)}#liveDot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .4s}#liveDot.on{background:var(--green);box-shadow:0 0 6px var(--green)}#camWrap{position:relative;width:100%;max-width:720px;border-radius:18px;overflow:hidden;background:#111;aspect-ratio:4/3;margin-bottom:16px}#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}#canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}#camOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}#camOverlay p{color:var(--muted);font-size:.9rem}#startBtn{background:var(--blue);color:#fff;border:none;border-radius:50px;padding:13px 36px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s}#startBtn:disabled{opacity:.4;cursor:default}#countPill{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:50px;padding:6px 14px;font-size:.85rem;font-weight:600;display:none}#countPill span{color:var(--green)}.grid{width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border-radius:16px;padding:18px 20px}.card.wide{grid-column:1/-1}.card-label{font-size:.7rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.card-value{font-size:2rem;font-weight:700;letter-spacing:-.5px}.card-sub{font-size:.78rem;color:var(--muted);margin-top:4px}#locCard .coords{font-size:1rem;font-weight:600;color:var(--blue);margin-bottom:4px}#locCard .addr{font-size:.8rem;color:var(--muted)}</style></head><body><header><h1>🎯 Human Tracker</h1><div id="liveBadge"><div id="liveDot"></div><span id="liveLabel">Idle</span></div></header><div id="camWrap"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><div id="countPill">People: <span id="countNum">0</span></div><div id="camOverlay"><p id="modelStatus">Loading AI model…</p><button id="startBtn" disabled>Start Camera</button></div></div><div class="grid"><div class="card"><div class="card-label">👤 People Detected</div><div class="card-value" id="peopleVal">0</div><div class="card-sub">in frame</div></div><div class="card"><div class="card-label">📊 Confidence</div><div class="card-value" id="confVal">—</div><div class="card-sub">best detection</div></div><div class="card wide" id="locCard"><div class="card-label">📍 Your Location</div><div class="coords" id="coords">Requesting GPS…</div><div class="addr" id="addr"></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.17.0/tf.min.js"></script><script>const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js';document.head.appendChild(s);const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),startBtn=document.getElementById('startBtn'),overlay=document.getElementById('camOverlay'),modelSt=document.getElementById('modelStatus'),liveDot=document.getElementById('liveDot'),liveLabel=document.getElementById('liveLabel'),countPill=document.getElementById('countPill'),countNum=document.getElementById('countNum'),peopleVal=document.getElementById('peopleVal'),confVal=document.getElementById('confVal'),coordsEl=document.getElementById('coords'),addrEl=document.getElementById('addr');let model=null;s.onload=async()=>{try{model=await cocoSsd.load();modelSt.textContent='AI model ready';startBtn.disabled=false;}catch(e){modelSt.textContent='Model failed: '+e.message;}};startBtn.addEventListener('click',async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});video.srcObject=stream;await video.play();overlay.style.display='none';countPill.style.display='block';liveDot.classList.add('on');liveLabel.textContent='Live';requestAnimationFrame(detect);}catch(e){modelSt.textContent='Camera error: '+e.message;}});async function detect(){if(!model||video.readyState<2){requestAnimationFrame(detect);return;}canvas.width=video.videoWidth;canvas.height=video.videoHeight;const preds=await model.detect(video);ctx.clearRect(0,0,canvas.width,canvas.height);let people=0,bestConf=0;for(const p of preds){if(p.class!=='person')continue;people++;if(p.score>bestConf)bestConf=p.score;const[x,y,w,h]=p.bbox;const conf=Math.round(p.score*100);ctx.shadowColor='#30d158';ctx.shadowBlur=12;ctx.strokeStyle='#30d158';ctx.lineWidth=2.5;ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;const cs=16;ctx.strokeStyle='#fff';ctx.lineWidth=3;[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy],i)=>{ctx.beginPath();ctx.moveTo(cx+(i%2===0?cs:-cs),cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+(i<2?cs:-cs));ctx.stroke();});ctx.font='bold 13px -apple-system,Inter,sans-serif';const lbl=`Person · ${conf}%`;const tw=ctx.measureText(lbl).width;ctx.fillStyle='rgba(48,209,88,0.9)';ctx.beginPath();ctx.roundRect(x,y-26,tw+14,22,6);ctx.fill();ctx.fillStyle='#000';ctx.fillText(lbl,x+7,y-9);}countNum.textContent=people;peopleVal.textContent=people;confVal.textContent=bestConf?Math.round(bestConf*100)+'%':'—';requestAnimationFrame(detect);}if('geolocation'in navigator){navigator.geolocation.watchPosition(pos=>{const lat=pos.coords.latitude.toFixed(6);const lng=pos.coords.longitude.toFixed(6);coordsEl.textContent=`${lat}° N,  ${lng}° E`;fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`).then(r=>r.json()).then(d=>{const a=d.address;const parts=[a.road,a.suburb||a.neighbourhood,a.city||a.town||a.village].filter(Boolean);addrEl.textContent=parts.join(', ');}).catch(()=>{});},err=>{coordsEl.textContent='Location denied';},{enableHighAccuracy:true});}else{coordsEl.textContent='GPS not available';}</script></body></html>
